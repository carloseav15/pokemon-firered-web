<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor del mundo — Kanto exterior</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: sans-serif; }
      #bar { display: flex; gap: 12px; align-items: center; padding: 6px 10px; background: #111; color: #eee; flex-wrap: wrap; }
      #bar input[type="search"] { width: 260px; }
      #layers { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
      #layers label { display: flex; gap: 3px; align-items: center; }
      #layers .swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid #666; }
      #main { display: flex; height: calc(100% - 60px); }
      #viewport { flex: 1; overflow: auto; background: #222; cursor: grab; }
      #content { position: relative; transform-origin: 0 0; }
      .map { position: absolute; }
      .map canvas.base { image-rendering: pixelated; display: block; }
      .map canvas.overlay { position: absolute; left: 0; top: 0; image-rendering: pixelated; pointer-events: none; }
      #panel { width: 340px; overflow: auto; padding: 10px; background: #f5f5f5; font-size: 13px; }
      #panel h2 { font-size: 15px; margin: 4px 0; }
      #panel h3 { font-size: 13px; margin: 8px 0 2px; }
      #meta { font-size: 12px; color: #bbb; }
    </style>
  </head>
  <body>
    <div id="bar">
      <strong>Visor Kanto exterior</strong>
      <input id="search" type="search" list="maplist" placeholder="Buscar mapa (p. ej. MAP_ROUTE1)" title="Dos dedos: mover · pellizcar, rueda del ratón o ⌘+rueda: zoom" />
      <datalist id="maplist"></datalist>
      <button id="zoom-in">+</button>
      <button id="zoom-out">−</button>
      <label><input id="anim-toggle" type="checkbox" /> animaciones</label>
      <span id="layers"></span>
      <span id="meta"></span>
    </div>
    <div id="main">
      <div id="viewport"><div id="content"></div></div>
      <aside id="panel"><p>Pincha una casilla para ver su ficha.</p></aside>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
