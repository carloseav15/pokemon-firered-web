<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Map — Kanto exterior</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <header id="bar">
      <nav data-site-navigation="world"></nav>
      <a href="/" class="btn" title="Return home" style="text-decoration:none; font-weight:700">🧭 Hub</a>
      <div class="app-title"><span></span> Kanto Exterior · Pokémon Odyssey</div>
      <div class="search-wrap">
        <input id="search" type="search" aria-label="Search maps" placeholder="Search maps…" title="Press / to search" autocomplete="off" />
        <span class="search-shortcut">/</span>
        <div id="search-results" class="search-results" style="display:none;"></div>
      </div>

      <div class="btn-group">
        <button id="zoom-in" class="btn btn-icon" title="Zoom in (+)">+</button>
        <button id="zoom-out" class="btn btn-icon" title="Zoom out (−)">−</button>
      </div>

      <button id="layers-btn" class="btn" popovertarget="layers-menu" title="Toggle map layers">
        Layers ▾
      </button>

      <div id="layers-menu" popover="auto">
        <div class="menu-header">
          <span class="menu-header-title">Visible layers</span>
          <div class="layer-actions">
            <button id="layers-all">All</button>
            <button id="layers-none">None</button>
          </div>
        </div>
      </div>

      <div class="btn-group" id="mode-group">
        <button id="mode-viewer-btn" class="btn active-mode" title="Browse regional maps">
          🗺️ Browse
        </button>
        <button id="mode-explore-btn" class="btn" title="Walk through the map">
          🧭 Explore
        </button>
        <button id="bike-btn" class="btn" style="display:none;" title="Toggle bicycle (B)">
          🚲 Bicycle
        </button>
      </div>

      <button id="audio-btn" class="btn" title="Toggle music and sound (M)">
        🔇 Audio
      </button>

      <button id="panel-toggle" class="btn" title="Toggle side panel">Panel ◨</button>
      <div style="flex: 1"></div>

      <button id="overflow-btn" class="btn" popovertarget="overflow-menu" title="More options">
        Options ⚙
      </button>

      <div id="overflow-menu" popover="auto">
        <div class="menu-header">
          <span class="menu-header-title">Map settings</span>
        </div>
        <label><input id="audio-toggle" type="checkbox" /> Music and sounds (BGM/SE)</label>
        <label><input id="anim-toggle" type="checkbox" /> Animate tiles</label>
        <label for="player-char" style="display:flex; justify-content:space-between; gap:12px;">
          Character:
          <select id="player-char">
            <option value="red">Red</option>
            <option value="leaf">Leaf</option>
          </select>
        </label>
        <label for="fill-biome" style="display:flex; justify-content:space-between; gap:12px;">
          Background biome:
          <select id="fill-biome" title="Automatic fill is a visual background, separate from the project's painted terrain">
            <option value="auto">Automatic (visual fill)</option>
            <option value="ocean">Ocean only (water)</option>
            <option value="trees">Forest only (trees)</option>
            <option value="mountain">Mountains only (rocks)</option>
          </select>
        </label>
        <label for="fill-mode" style="display:flex; justify-content:space-between; gap:12px;">
          Visual fill:
          <select id="fill-mode">
            <option value="full">Full</option>
            <option value="dim">Dim</option>
            <option value="off">Off</option>
          </select>
        </label>
        <label><input id="radar-toggle" type="checkbox" checked /> Radar minimap</label>
      </div>
    </header>

    <main id="main">
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div id="loading-text" class="loading-text">Loading regional maps…</div>
      </div>
      <div id="viewport">
        <div id="world-stage">
          <div id="content">
            <div id="selection-box"></div>
            <div id="player-sprite"></div>
          </div>
        </div>
      </div>
      <div id="dialog-box" role="status" aria-labelledby="dialog-title">
        <div id="dialog-title">MESSAGE</div>
        <div id="dialog-text">...</div>
        <div id="dialog-foot">
          <span id="dialog-prompt">Press Z / Space / Enter to continue</span>
          <button id="dialog-close" class="btn" type="button">Close</button>
        </div>
      </div>
      <div id="minimap-wrap">
        <div id="minimap-title">Navigation map</div>
        <div id="minimap-canvas-wrap">
          <canvas id="minimap-canvas" width="176" height="130"></canvas>
          <div id="minimap-viewbox"></div>
          <div id="minimap-player-dot"></div>
        </div>
      </div>
      <aside id="panel"><p>Select a tile to inspect it.</p></aside>
    </main>

    <footer id="statusbar">
      <span id="status-meta">Outdoor maps · Kanto GBA</span>
      <span id="status-pos">Cursor: <code>--</code></span>
    </footer>
    <script type="module" src="/src/map-viewer/entry.ts"></script>
  <script type="module" src="/src/web/siteNavigation.ts"></script>
  </body>
</html>
