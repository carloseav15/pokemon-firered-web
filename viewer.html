<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor del mundo — Kanto exterior</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <header id="bar">
      <div class="app-title"><span></span> Kanto Exterior</div>
      <div class="search-wrap">
        <input id="search" type="search" list="maplist" placeholder="Buscar mapa..." title="Presiona '/' para buscar rápido" />
        <span class="search-shortcut">/</span>
        <datalist id="maplist"></datalist>
      </div>

      <div class="btn-group">
        <button id="zoom-in" class="btn btn-icon" title="Acercar (+)">+</button>
        <button id="zoom-out" class="btn btn-icon" title="Alejar (−)">−</button>
      </div>

      <button id="layers-btn" class="btn" popovertarget="layers-menu" title="Alternar capas visibles">
        Capas ▾
      </button>

      <div id="layers-menu" popover="auto">
        <div class="menu-header">
          <span class="menu-header-title">Capas Visibles</span>
          <div class="layer-actions">
            <button id="layers-all">Todas</button>
            <button id="layers-none">Ninguna</button>
          </div>
        </div>
      </div>

      <div class="btn-group" id="mode-group">
        <button id="mode-viewer-btn" class="btn active-mode" title="Modo Visor: Navegar libremente y consultar mapas">
          🗺️ Visor
        </button>
        <button id="mode-explore-btn" class="btn" title="Modo Exploración: Controlar al protagonista (WASD / Bici / Surf)">
          🏃 Explorar
        </button>
        <button id="mode-edit-btn" class="btn" title="Modo Edición: Clonar y pintar tiles en el mapa o relleno">
          🖌️ Editar
        </button>
      </div>

      <div id="edit-toolbar" style="display: none; align-items: center; gap: 8px;">
        <div id="tile-brush-preview" title="Tile seleccionado para clonar/pintar" style="width: 24px; height: 24px; border: 1.5px solid #f59e0b; border-radius: 4px; background: #000; image-rendering: pixelated; display: flex; align-items: center; justify-content: center; font-size: 10px;"></div>
        <span id="tile-brush-label" style="font-size: 11px; color: #fbbf24; font-family: var(--font-mono);">Tile: #28</span>
        <button id="eyedropper-btn" class="btn" title="Clic en cualquier casilla del mapa original para clonar su tile">
          🔍 Clonar tile
        </button>
      </div>

      <button id="bike-btn" class="btn" style="display: none;" title="Subir / bajar de la bicicleta (Tecla B)">
        🚲 Bici
      </button>

      <button id="panel-toggle" class="btn" title="Ocultar/mostrar panel lateral">Panel ◨</button>
      <div style="flex: 1"></div>

      <button id="overflow-btn" class="btn" popovertarget="overflow-menu" title="Opciones avanzadas">
        Opciones ⚙
      </button>

      <div id="overflow-menu" popover="auto">
        <div class="menu-header">
          <span class="menu-header-title">Ajustes del Visor</span>
        </div>
        <label><input id="anim-toggle" type="checkbox" /> Animaciones (60 FPS)</label>
        <label for="fill-biome" style="display:flex; justify-content:space-between; gap:12px;">
          Bioma de fondo:
          <select id="fill-biome">
            <option value="auto">Automático (Canónico)</option>
            <option value="ocean">Solo Océano (Agua)</option>
            <option value="trees">Solo Bosque (Árboles)</option>
            <option value="mountain">Solo Montaña (Rocas)</option>
          </select>
        </label>
        <label for="fill-mode" style="display:flex; justify-content:space-between; gap:12px;">
          Relleno visual:
          <select id="fill-mode">
            <option value="full">Completo</option>
            <option value="dim">Atenuado</option>
            <option value="off">Desactivado</option>
          </select>
        </label>
        <label for="player-char" style="display:flex; justify-content:space-between; gap:12px;">
          Protagonista:
          <select id="player-char">
            <option value="red">Rojo (Red)</option>
            <option value="leaf">Hoja (Leaf)</option>
          </select>
        </label>
        <label><input id="radar-toggle" type="checkbox" checked /> Minimapa Radar</label>
      </div>
    </header>

    <main id="main">
      <div id="viewport">
        <div id="content">
          <div id="selection-box"></div>
          <div id="player-sprite"></div>
        </div>
      </div>
      <div id="minimap-wrap">
        <div id="minimap-title">Mapa de Navegación</div>
        <div id="minimap-canvas-wrap">
          <canvas id="minimap-canvas" width="176" height="130"></canvas>
          <div id="minimap-viewbox"></div>
          <div id="minimap-player-dot"></div>
        </div>
      </div>
      <div id="dialog-box">
        <div id="dialog-title"></div>
        <div id="dialog-text"></div>
        <div id="dialog-prompt">Presiona [Espacio] o [Enter] para continuar ▾</div>
      </div>
      <aside id="panel"><p>Pincha una casilla para ver su ficha.</p></aside>
    </main>

    <footer id="statusbar">
      <span id="status-meta">37 mapas exteriores · Kanto GBA</span>
      <span id="status-pos">Cursor: <code>--</code></span>
    </footer>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
