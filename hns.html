<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Johto GBA — Heart &amp; Soul</title>
  <link rel="stylesheet" href="/src/hns/maps.css" />
</head>
<body>
  <header>
    <a href="/atlas.html">☰ Atlas</a>
    <h1>Johto GBA · Heart &amp; Soul</h1>
    <label>Región <select id="region" aria-label="Visor de región"><option value="hns">Johto / Kanto · HnS</option><option value="firered">Kanto · FireRed</option><option value="emerald">Hoenn · Emerald</option><option value="crystal">Johto / Kanto · Crystal</option></select></label>
    <button id="world-btn">Mundo conectado</button>
    <button id="back" disabled>← Volver</button>
    <label>Zoom <select id="zoom"><option value="0.125">⅛×</option><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option></select></label>
    <label><input id="events" type="checkbox" checked /> Eventos</label>
  </header>
  <main>
    <aside>
      <label for="search">Buscar mapa</label><input id="search" type="search" placeholder="New Bark, Goldenrod, Route…" />
      <label for="filter">Catálogo</label><select id="filter"><option value="rendered">Mapas renderizados</option><option value="world">Exteriores conectados</option><option value="all">Toda la fuente (incluye heredados)</option></select>
      <p id="count" role="status">Cargando…</p>
      <nav id="list" aria-label="Mapas"></nav>
    </aside>
    <section id="workspace">
      <div id="meta" role="status">Cargando mapas…</div>
      <div id="viewport" tabindex="0" aria-label="Mapa; arrastra el fondo para moverlo"><div id="sizer"><div id="stage"></div></div></div>
      <div id="detail"></div>
    </section>
  </main>
  <footer>Adaptación GBA de Heart &amp; Soul. Tiles estáticos; objetos como marcadores. <a href="https://github.com/PokemonHnS-Development/pokemonHnS#credits" target="_blank" rel="noreferrer">Fuente y créditos</a> · <span id="source"></span></footer>
  <script type="module" src="/src/hns/maps.ts"></script>
</body>
</html>
