<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapas de Pokémon Crystal</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0f14; --panel:#111827; --line:#243040; --fg:#e5e7eb; --mut:#9ca3af; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, sans-serif; }
      header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
      header h1 { font-size:15px; margin:0; }
      input[type=search], select { background:#1f2937; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 10px; font:inherit; }
      a { color:#93c5fd; text-decoration:none; } a:hover { text-decoration:underline; }
      #layout { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 49px); }
      #list { overflow:auto; border-right:1px solid var(--line); }
      .grp { padding:6px 12px 2px; color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.06em; position:sticky; top:0; background:var(--bg); }
      .row { padding:3px 12px; cursor:pointer; display:flex; gap:6px; justify-content:space-between; }
      .row:hover, .row.sel { background:#16202f; }
      .row small { color:var(--mut); }
      #detail { overflow:auto; padding:14px 22px 60px; }
      h2 { margin:0 0 4px; font-size:20px; }
      h3 { margin:20px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); border-bottom:1px solid var(--line); padding-bottom:3px; }
      .meta { color:var(--mut); }
      .bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:10px 0; }
      .stage { position:relative; display:inline-block; border:1px solid var(--line); background:#000; line-height:0; }
      .stage img { image-rendering:pixelated; display:block; }
      .mk { position:absolute; border:2px solid; border-radius:3px; background:#0008; cursor:default; }
      .mk.warp { border-color:#38bdf8; cursor:pointer; } .mk.bg { border-color:#facc15; } .mk.obj { border-color:#f87171; } .mk.coord { border-color:#c084fc; }
      .mk:hover { background:#fff3; z-index:3; }
      table { border-collapse:collapse; } td, th { padding:2px 10px 2px 0; text-align:left; font-weight:normal; vertical-align:top; }
      th { color:var(--mut); }
      .dot { display:inline-block; width:10px; height:10px; border:2px solid; border-radius:2px; margin-right:4px; vertical-align:-1px; }
      .none { color:var(--mut); font-style:italic; }
      @media (max-width:900px) { #layout { grid-template-columns:1fr; } #list { max-height:34vh; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Mapas de Pokémon Crystal</h1>
      <a href="/atlas.html">☰ Atlas</a>
      <input id="q" type="search" placeholder="Mapa, tileset o localización…" />
      <span id="count" class="meta"></span>
      <a href="/crystal-world.html" style="margin-left:auto">Mapa del mundo →</a>
    </header>
    <div id="layout">
      <div id="list"></div>
      <div id="detail"><p class="none">Cargando…</p></div>
    </div>
    <script type="module" src="/src/compare/crystalMain.ts"></script>
  </body>
</html>
